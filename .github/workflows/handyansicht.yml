name: Handy-Ansicht automatisch einbauen
on:
  push:
    branches: [main]
    paths: ['Websiten/**']
permissions:
  contents: write
jobs:
  einbauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/handyansicht.py
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "vorschau-rathsack"
            git config user.email "vorschau-rathsack@users.noreply.github.com"
            git commit -am "Handy-Ansicht automatisch ergänzt"
            git push
          fi
